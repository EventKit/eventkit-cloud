version: "3.4"

x-app: &default-app
  build:
    context: .
    dockerfile: Dockerfile
  image: eventkit/eventkit-base:1.15.0-2
  user: ${EK_UID}:${EK_GID}
  restart: always
  stop_grace_period: "3s"
  depends_on:
    postgis:
      condition: service_healthy
  extra_hosts:
    - "${SITE_NAME}:host-gateway"
  healthcheck:
    interval: 1m
    timeout: 10s
    retries: 3
    start_period: 10s

x-common-variables: &common-variables
  DATABASE_URL: postgres://eventkit:eventkit_exports@postgis:5432/eventkit_exports
  BROKER_URL: amqp://guest:guest@rabbitmq:5672/
  BROKER_API_URL: http://guest:guest@rabbitmq:15672/api/
  MEMCACHED: memcached:11211
  CELERY_RESULT_BACKEND: cache+memcached://memcached:11211
  CELERY_GROUP_NAME:
  CELERY_SCALE_BY_RUN: True
  QT_QPA_PLATFORM: offscreen
  DATAPACKS_DEFAULT_SHARED:
  MAPPROXY_LOGS_REQUESTS:
  MAPPROXY_LOGS_VERBOSE:
  MAPPROXY_LOGS_SILENT:
  SERVE_ESTIMATES:
  CONTENT_SECURITY_POLICY:
  SITE_NAME:
  SITE_IP:
  TERM:
  DEBUG:
  PRODUCTION:
  DJANGO_LOG_LEVEL:
  LOG_LEVEL:
  EXPORT_DOWNLOAD_ROOT:
  PYTHONWARNINGS:
  SSL_VERIFICATION:
  MAX_EXPORTRUN_EXPIRATION_DAYS:
  AWS_ENDPOINT_URL:
  AWS_STORAGE_BUCKET_NAME:
  AWS_ACCESS_KEY_ID:
  AWS_SECRET_ACCESS_KEY:
  CONTAINER_CODE_PATH:
  DEV_MACHINE_CODE_PATH:
  DJANGO_MODEL_LOGIN: True
  LOGIN_DISCLAIMER:
  BANNER_TEXT:
  BANNER_TEXT_COLOR:
  BANNER_BACKGROUND_COLOR:
  GEOCODING_API_URL:
  GEOCODING_API_TYPE:
  REVERSE_GEOCODING_API_URL:
  GEOCODING_UPDATE_URL:
  CONVERT_API_URL:
  BASEMAP_URL:
  GEOCODING_AUTH_CERT:
  GEOCODING_AUTH_URL:
  PROVIDER_CHECK_INTERVAL:
  TILE_CACHE_DIR:
  ROCKETCHAT_NOTIFICATIONS:
  LAND_DATA_URL:
  BASE_URL:
  MATOMO_URL:
  MATOMO_CUSTOM_DIM_ID:
  MATOMO_CUSTOM_VAR_ID:
  MATOMO_CUSTOM_VAR_NAME:
  MATOMO_CUSTOM_VAR_SCOPE:
  MATOMO_SITE_ID:
  MATOMO_APPNAME:
  SECRET_KEY:
  CONDA_REPO:
  EVENTKIT_CRED:
  EVENTKIT_CERT_PASS:
  DATA_UPLOAD_MAX_MEMORY_SIZE: 10000000
  OAUTH_NAME:
  OAUTH_AUTHORIZATION_URL:
  OAUTH_TOKEN_URL:
  OAUTH_PROFILE_URL:
  OAUTH_REDIRECT_URI:
  OAUTH_PROFILE_SCHEMA:
  OAUTH_RESPONSE_TYPE:
  OAUTH_SCOPE:
  OAUTH_TOKEN_KEY:
  OAUTH_CLIENT_ID:
  OAUTH_CLIENT_SECRET:
  OAUTH_LOGOUT_URL:
  OVERPASS_API_URL:
  ENABLE_ADMIN:
  ENABLE_ADMIN_LOGIN:
  ADMIN_ROOT:
  JOB_MAX_EXTENT: 1000000
  GRID_TOKEN:

services:
  eventkit:
    <<: *default-app
    volumes:
      -  ./:/app/
    depends_on:
      - postgis
      - rabbitmq
      - memcached
      - minio
    links:
      - postgis
      - rabbitmq
      - memcached
      - minio
    expose:
      - "6080"
    command: gunicorn eventkit_cloud.wsgi:application -c eventkit_cloud/gunicorn.py --bind 0.0.0.0:6080 --worker-class gevent --workers 8 --threads 2 --name eventkit --user eventkit --no-sendfile --reload
    environment:
      <<: *common-variables

  map:
    <<: *default-app
    volumes:
      # using the root directory here will break mapproxy tile locks.
      - ./scripts:/app/scripts
      - ./eventkit_cloud:/app/eventkit_cloud
      - ./manage.py:/app/manage.py
      - ./config:/app/config
    depends_on:
      - postgis
      - memcached
    links:
      - postgis
      - memcached
    expose:
      - "6080"
    command: gunicorn eventkit_cloud.wsgi:application -c eventkit_cloud/gunicorn.py --bind 0.0.0.0:6080 --worker-class gevent --workers 8 --threads 2 --name eventkit --user eventkit --no-sendfile --reload --timeout 60
    environment:
      <<: *common-variables

  memcached:
    image: "memcached:1.6.29"
    expose:
      - "11211"
    command: memcached -m 2048 -I 25m

  celery:
    <<: *default-app
    volumes:
      - ./:/app/
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/run-celery-beat.sh:/app/scripts/run-celery-beat.sh
    depends_on:
      - postgis
      - rabbitmq
      - eventkit
      - minio
    links:
      - postgis
      - rabbitmq
    environment:
      <<: *common-variables
    command: bash ./scripts/run-celery-beat.sh
  postgis:
    image: kartoza/postgis:14
    environment:
      POSTGRES_USER: eventkit
      POSTGRES_PASS: eventkit_exports
      POSTGRES_DBNAME: eventkit_exports
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER
    expose:
      - "5432"
    # This is stored up a directory because there will be permissions issues if ran with Vagrant shared directory.
    volumes:
      - "./config/postgis.conf:/settings/extra.conf"
      - "postgis_database:/var/lib/postgresql"
  rabbitmq:
    image: rabbitmq:3.9-management
    hostname: rabbitmq
    expose:
      - "5672"
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
  mkdocs:
    image: cfinfrastructure/mkdocs:latest
    working_dir: /build
    volumes:
      - ./mkdocs.yml:/build/mkdocs.yml
      - ./docs:/build/docs
      - ./site:/build/site
    command: mkdocs build
    # run the development server: docker-compose run --rm -p 8000:8000 mkdocs mkdocs serve -a 0.0.0.0:8000
  httpd:
    image: httpd:2.4.23
    volumes:
      - ./config/eventkit-docker.conf:/usr/local/apache2/conf/httpd.conf
      - ./eventkit_cloud:/app/eventkit_cloud
      - ./exports_stage:/app/exports_stage
      - ./site:/app/site
    links:
      - eventkit
      - map
      - webpack
      - mkdocs
    ports:
      - "80:80"
      - "9229:9229"
    environment:
      SITE_NAME: ${SITE_NAME}
      LOG_LEVEL: warn
  flower:
    <<: *default-app
    volumes:
      - ./:/app/
    user: eventkit
    depends_on:
      - rabbitmq
      - eventkit
      - postgis
    links:
      - rabbitmq
      - postgis
    ports:
      - "49555:5555"
    command: celery flower -A eventkit_cloud --address=0.0.0.0 --port=5555 --broker=amqp://guest:guest@rabbitmq:5672/ --broker_api=http://guest:guest@rabbitmq:15672/api/
    environment:
      <<: *common-variables
  webpack:
    image: eventkit/eventkit-webpack:1.15.0-1
    build:
      context: .
      dockerfile: webpack.Dockerfile
    volumes:
      - ./eventkit_cloud:/app/eventkit_cloud
      - ./coverage:/app/coverage
      - ./package.json:/app/package.json
      - ./.eslintrc.json:/app/.eslintrc.json
      - ./.eslintignore:/app/.eslintignore
      - ./webpack.config.js:/app/webpack.config.js
      - ./babel.config.js:/app/babel.config.js
      - ./setupFile.js:/app/setupFile.js
      - ./tsconfig.json:/app/tsconfig.json
      - ./tslint.json:/app/tslint.json
      - ./.git:/app/.git
    user: eventkit
    ports:
      - "8080:8080"
    expose:
      - "9229"
    extra_hosts:
      -  "${SITE_NAME}:host-gateway"
    #if wishing to use the dev server uncomment this or run it via the command line
    # command: node --debug-brk --inspect=${SITE_NAME}:9229 ./node_modules/.bin/jest --runInBand
  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    volumes:
      - "minio_data:/data"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: AWS_ID
      MINIO_ROOT_PASSWORD: AWS_SECRET
volumes:
  postgis_database:
  rabbitmq:
  minio_data:
